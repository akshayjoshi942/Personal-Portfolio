<head>
  <meta charset="UTF-8" />

  <title>Akshay Joshi | AI & Data Strategy Manager</title>
  <meta name="description" content="Akshay Joshi - AI & Data Strategy Manager at Deloitte Consulting specializing in Value-Based Care." />

  <style>
    :root {
      --bg: #fdfdfd;
      --surface: #ffffff;
      --text: #111827;
      --text-muted: #4b5563;
      --text-dim: #6b7280;
      --line: #e5e7eb;
      --line-dark: #111827;
      --accent: #0f172a;
      --serif: 'Newsreader', Georgia, serif;
      --sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      padding: 3.5rem 1.5rem;
    }

    .wrapper {
      max-width: 960px;
      margin: 0 auto;
      background: var(--surface);
    }

    /* Header */
    header {
      padding-bottom: 2rem;
      border-bottom: 2px solid var(--line-dark);
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 1.5rem;
    }

    .header-main h1 {
      font-family: var(--serif);
      font-size: 2.75rem;
      font-weight: 500;
      letter-spacing: -0.02em;
      line-height: 1.1;
      color: var(--accent);
    }

    .header-main p {
      font-size: 1.05rem;
      font-weight: 500;
      color: var(--text-muted);
      margin-top: 0.5rem;
      letter-spacing: -0.01em;
    }

    .header-meta {
      text-align: right;
      font-size: 0.88rem;
      color: var(--text-dim);
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .header-meta a {
      color: var(--text);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .header-meta a:hover {
      color: var(--text-muted);
    }

    /* Executive Summary Callout */
    .summary-section {
      padding: 2rem 0;
      border-bottom: 1px solid var(--line);
    }

    .summary-text {
      font-family: var(--serif);
      font-size: 1.25rem;
      line-height: 1.65;
      color: #1f2937;
      font-weight: 400;
    }

    /* 2-Column Grid Layout */
    .content-grid {
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 3.5rem;
      padding-top: 2.5rem;
    }

    /* Section Typography */
    h2.section-heading {
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 1.25rem;
      padding-bottom: 0.4rem;
      border-bottom: 1px solid var(--line);
    }

    /* Left Sidebar */
    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 2.5rem;
    }

    .sidebar-block h3 {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 0.25rem;
    }

    .sidebar-block p {
      font-size: 0.88rem;
      color: var(--text-muted);
    }

    .sub-detail {
      font-size: 0.82rem;
      color: var(--text-dim);
      margin-top: 0.15rem;
    }

    .item-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .tag-group {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      margin-top: 0.5rem;
    }

    .tag-category {
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-dim);
      margin-top: 0.6rem;
    }

    .tag-values {
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    /* Main Experience Column */
    .main-column {
      display: flex;
      flex-direction: column;
      gap: 2.75rem;
    }

    .experience-entry {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .org-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid var(--line);
      padding-bottom: 0.5rem;
    }

    .org-name {
      font-family: var(--serif);
      font-size: 1.45rem;
      font-weight: 600;
      color: var(--accent);
    }

    .org-location-tenure {
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--text-dim);
    }

    /* Role Progression Ladder */
    .role-ladder {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin: 0.25rem 0 0.75rem 0;
    }

    .role-tier {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 0.92rem;
    }

    .role-tier-title {
      font-weight: 600;
      color: var(--text);
    }

    .role-tier.current .role-tier-title {
      color: #047857;
    }

    .role-tier-date {
      font-size: 0.82rem;
      color: var(--text-dim);
    }

    ul.impact-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }
